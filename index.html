<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Pinball</title>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#e9fbff;font-family:Arial,sans-serif;overflow:hidden}
  #wrap{position:relative;width:min(94vw,620px);aspect-ratio:3/4;filter:drop-shadow(0 0 32px #00d9ff55)} canvas{width:100%;height:100%;display:block;border:4px solid #71f3ff;border-radius:28px;background:#07192a;box-shadow:inset 0 0 40px #02cfff44}
  #hud{position:absolute;inset:22px 30px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 0 9px #00e5ff;font-weight:bold;letter-spacing:1px}.small{font-size:12px;opacity:.8}
  #help{position:fixed;bottom:18px;text-align:center;font-size:13px;line-height:1.55;color:#b8e7ff}.key{display:inline-block;border:1px solid #70dffa;border-radius:4px;padding:1px 5px;margin:0 2px;background:#12314c}
</style>
</head>
<body>
<main id="wrap"><canvas id="game" width="600" height="800"></canvas><div id="hud"><div>SCORE <span id="score">000000</span><div class="small">HIGH <span id="high">000000</span></div></div><div>BALLS <span id="balls">3</span><div class="small" id="message">PRESS SPACE</div></div></div></main>
<div id="help"><span class="key">←</span><span class="key">→</span> flippers &nbsp; <span class="key">Space</span> launch / restart &nbsp; <span class="key">Z</span><span class="key">/</span><span class="key">?</span> also work</div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d');
let keys={},score=0,high=+localStorage.pinballHigh||0,ballCount=3,playing=false,launching=false,ball,flL=0,flR=0,particles=[],stars=[];
const ui={score:document.querySelector('#score'),high:document.querySelector('#high'),balls:document.querySelector('#balls'),message:document.querySelector('#message')};
for(let i=0;i<85;i++)stars.push({x:Math.random()*600,y:Math.random()*800,r:Math.random()*1.6,a:Math.random()});
const bumpers=[{x:205,y:270,r:36,h:0},{x:396,y:270,r:36,h:0},{x:300,y:375,r:42,h:0}];
const targets=[{x:110,y:185,a:-.25,on:0},{x:490,y:185,a:.25,on:0},{x:125,y:445,a:.3,on:0},{x:475,y:445,a:-.3,on:0}];
function newBall(){ball={x:300,y:165,vx:(Math.random()-.5)*4,vy:0,r:11,trail:[]};launching=true;ui.message.textContent='';}
newBall();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowleft','arrowright','z','/'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' '&&!playing){score=0;ballCount=3;playing=true;newBall();}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function add(n){score+=n;high=Math.max(high,score);localStorage.pinballHigh=high;ui.score.textContent=String(score).padStart(6,'0');ui.high.textContent=String(high).padStart(6,'0');}
function spark(px,py,col,n=12){for(let i=0;i<n;i++){let a=Math.random()*7,v=1+Math.random()*4;particles.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:18+Math.random()*15,col});}}
function lineHit(a,b){let dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,t=Math.max(0,Math.min(1,((ball.x-a.x)*dx+(ball.y-a.y)*dy)/l)),px=a.x+t*dx,py=a.y+t*dy,ex=ball.x-px,ey=ball.y-py,d=Math.hypot(ex,ey);if(d<ball.r+7&&ball.vx*ex+ball.vy*ey<0){let nx=ex/d,ny=ey/d,q=ball.vx*nx+ball.vy*ny;ball.vx-=2*q*nx;ball.vy-=2*q*ny;ball.x=px+nx*(ball.r+8);ball.y=py+ny*(ball.r+8);return true}}
function circleHit(o){let dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy),min=ball.r+o.r;if(d<min){let nx=dx/d,ny=dy/d,v=ball.vx*nx+ball.vy*ny;ball.vx+=nx*(8-v*1.8);ball.vy+=ny*(8-v*1.8);ball.x=o.x+nx*min;ball.y=o.y+ny*min;o.h=10;add(100);spark(o.x,o.y,'#ffe66d');}}
function update(){flL+=(keys.arrowleft||keys.z?1:0-flL)*.28;flR+=(keys.arrowright||keys['/']?1:0-flR)*.28;flL=Math.max(0,Math.min(1,flL));flR=Math.max(0,Math.min(1,flR));
 if(playing){ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>12)ball.trail.shift();ball.vy+=.29;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.998;ball.vy*=.998;
  if(ball.x-ball.r<35){ball.x=35+ball.r;ball.vx=Math.abs(ball.vx)*.9}if(ball.x+ball.r>565){ball.x=565-ball.r;ball.vx=-Math.abs(ball.vx)*.9}if(ball.y-ball.r<75){ball.y=75+ball.r;ball.vy=Math.abs(ball.vy)*.9}
  bumpers.forEach(circleHit);targets.forEach(t=>{let dx=Math.cos(t.a)*18,dy=Math.sin(t.a)*18;if(lineHit({x:t.x-dx,y:t.y-dy},{x:t.x+dx,y:t.y+dy})){t.on=10;add(50);spark(t.x,t.y,'#ff65cb',7)}});
  const L1={x:130,y:675},L2={x:248+flL*30,y:700-flL*45},R1={x:470,y:675},R2={x:352-flR*30,y:700-flR*45}; if(lineHit(L1,L2)){ball.vy-=flL*12;add(10)} if(lineHit(R1,R2)){ball.vy-=flR*12;add(10)}
  if(ball.y>820){ballCount--;ui.balls.textContent=ballCount;if(ballCount){newBall()}else{playing=false;ui.message.textContent='GAME OVER · SPACE';}}
 }
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--});particles=particles.filter(p=>p.life>0);bumpers.forEach(b=>b.h=Math.max(0,b.h-1));targets.forEach(t=>t.on=Math.max(0,t.on-1));}
function glow(col,blur=12){x.shadowColor=col;x.shadowBlur=blur;x.strokeStyle=col;x.fillStyle=col}function seg(a,b,w=7){x.lineWidth=w;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
function draw(){x.clearRect(0,0,600,800);x.fillStyle='#06111f';x.fillRect(0,0,600,800);stars.forEach(s=>{x.fillStyle=`rgba(128,230,255,${.18+s.a*.45})`;x.fillRect(s.x,s.y,s.r,s.r)});
 x.save();glow('#27e6ff',20);x.lineWidth=6;x.strokeRect(35,75,530,690);x.beginPath();x.moveTo(35,565);x.lineTo(95,735);x.lineTo(235,755);x.moveTo(565,565);x.lineTo(505,735);x.lineTo(365,755);x.stroke();x.restore();
 bumpers.forEach(b=>{x.save();glow(b.h?'#fff07a':'#ff4fb9',b.h?28:14);x.lineWidth=5;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke();x.fillStyle='rgba(255,50,170,.16)';x.fill();x.restore();});
 targets.forEach(t=>{x.save();glow(t.on?'#fff':'#ff65cb',t.on?20:9);x.translate(t.x,t.y);x.rotate(t.a);x.fillRect(-18,-6,36,12);x.restore();});
 x.save();glow('#8dff65',18);seg({x:130,y:675},{x:248+flL*30,y:700-flL*45},13);seg({x:470,y:675},{x:352-flR*30,y:700-flR*45},13);x.restore();
 x.save();glow('#00dcff',18);ball.trail.forEach((p,i)=>{x.globalAlpha=i/18;x.beginPath();x.arc(p.x,p.y,ball.r*i/14,0,7);x.fill()});x.globalAlpha=1;x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(ball.x-3,ball.y-4,3,0,7);x.fill();x.restore();
 particles.forEach(p=>{x.save();glow(p.col,12);x.globalAlpha=p.life/32;x.fillRect(p.x-2,p.y-2,4,4);x.restore()});
 x.fillStyle='#d9faff';x.font='bold 27px Arial';x.textAlign='center';x.fillText('NEON  PINBALL',300,125);x.font='12px Arial';x.fillStyle='#78ddea';x.fillText('HIT THE LIGHTS · KEEP THE BALL ALIVE',300,148);requestAnimationFrame(()=>{update();draw()});}
draw();
</script></body></html>
